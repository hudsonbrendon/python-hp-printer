[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "python-hp-printer"
version = "0.1.0"
description = "Async Python client for HP printers over the LAN: LEDM, CDM, eSCL (AirScan) and IPP"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
authors = [{ name = "Hudson Brendon", email = "contato.hudsonbrendon@gmail.com" }]
keywords = [
  "hp",
  "printer",
  "ledm",
  "escl",
  "airscan",
  "ipp",
  "scanner",
  "home-assistant",
  "async",
  "aiohttp",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: AsyncIO",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Printing",
  "Typing :: Typed",
]
dependencies = ["aiohttp>=3.10", "aioipp>=0.20", "yarl>=1.9"]

[project.urls]
Homepage = "https://github.com/hudsonbrendon/python-hp-printer"
Documentation = "https://hudsonbrendon.github.io/python-hp-printer/"
Repository = "https://github.com/hudsonbrendon/python-hp-printer"
Issues = "https://github.com/hudsonbrendon/python-hp-printer/issues"
Changelog = "https://github.com/hudsonbrendon/python-hp-printer/blob/main/CHANGELOG.md"

[project.scripts]
hp-printer = "hp_printer.__main__:main"

[dependency-groups]
dev = [
  "mypy>=1.14",
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "pytest-cov>=6",
  "pytest-timeout>=2.3",
  "ruff>=0.9",
]
docs = ["mkdocs-material>=9.6", "mkdocstrings[python]>=0.27"]

[tool.uv]
default-groups = ["dev"]

[tool.hatch.build.targets.sdist]
include = ["src/hp_printer", "tests", "docs", "README.md", "CHANGELOG.md"]

[tool.hatch.build.targets.wheel]
packages = ["src/hp_printer"]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "ANN401",  # Any in **kwargs
  "COM812",  # formatter conflict
  "CPY001",  # no copyright headers
  "D203",    # docstring style conflicts (keep D211)
  "D213",    # docstring style conflicts (keep D212)
  "D417",    # false positives on Args sections
  "ISC001",  # formatter conflict
  "PLR2004", # magic values are fine in protocol code
  "TRY003",  # long exception messages
  "EM101",   # string literal in exception
  "EM102",   # f-string in exception
  "FBT001",  # boolean positional args in setters are intentional
  "FBT002",
  "PLR0913", # protocol setters have many parameters
  "C901",    # XML parsing functions are branchy by nature
  "PLR0912",
  "PLR0915",
  "PLR0911", # state machines have many returns
  "ERA001",  # section banners look like commented code
  "TRY300",  # try/else style is a matter of taste
  "TC001",   # runtime imports are fine with `from __future__ import annotations`
  "TC002",
  "TC003",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
force-sort-within-sections = true
combine-as-imports = true
known-first-party = ["hp_printer"]

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = false
mark-parentheses = false

[tool.ruff.lint.per-file-ignores]
"tests/**/*" = ["ANN", "D", "E501", "PLR", "S", "SLF", "ARG", "INP", "FBT", "PT", "PLC0415", "ERA", "RUF012", "N806", "T201", "ASYNC", "EM", "TRY", "BLE", "C901", "PGH", "RUF"]
"examples/**" = ["T201", "INP001", "D100", "D103"]
"src/hp_printer/__main__.py" = ["T201", "ASYNC240"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_unreachable = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["pyipp.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q --cov=hp_printer --cov-report=term-missing"
timeout = 30

[tool.coverage.run]
source = ["hp_printer"]
branch = true
omit = ["src/hp_printer/__main__.py"]

[tool.coverage.report]
show_missing = true
fail_under = 85
